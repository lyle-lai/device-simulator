<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备模拟器管理平台</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <el-container style="height: 100vh;">
            <el-aside width="200px" style="background-color: #545c64;">
                <el-menu
                    :default-active="activeMenu"
                    class="el-menu-vertical-demo"
                    @select="handleMenuSelect"
                    background-color="#545c64"
                    text-color="#fff"
                    active-text-color="#ffd04b">
                    <div class="logo">
                        <h4>设备模拟器</h4>
                    </div>
                    <el-menu-item index="instances">
                        <el-icon><Monitor /></el-icon>
                        <span>实例监控</span>
                    </el-menu-item>
                    <el-menu-item index="profiles">
                        <el-icon><Document /></el-icon>
                        <span>画像管理</span>
                    </el-menu-item>
                    <el-menu-item index="payloads">
                        <el-icon><MessageBox /></el-icon>
                        <span>报文管理</span>
                    </el-menu-item>
                    <el-menu-item index="rules">
                        <el-icon><Setting /></el-icon>
                        <span>规则管理</span>
                    </el-menu-item>
                </el-menu>
            </el-aside>
            <el-main>
                <!-- 实例监控页面 -->
                <div v-if="activeMenu === 'instances'">
                    <h2>实例监控</h2>
                    <el-table :data="profileStatuses" style="width: 100%">
                        <el-table-column prop="profile.profileName" label="画像名称"></el-table-column>
                        <el-table-column prop="status" label="运行状态">
                            <template #default="scope">
                                <el-tag :type="scope.row.status === 'RUNNING' ? 'success' : (scope.row.status === 'STOPPED' ? 'info' : 'danger')">{{ scope.row.status }}</el-tag>
                            </template>
                        </el-table-column>
                        <el-table-column label="启用状态">
                            <template #default="scope">
                                <el-switch v-model="scope.row.profile.enabled" disabled></el-switch>
                            </template>
                        </el-table-column>
                        <el-table-column label="操作">
                            <template #default="scope">
                                <el-button size="small" @click="startInstance(scope.row.profile.profileName)" :disabled="scope.row.status === 'RUNNING' || !scope.row.profile.enabled">启动</el-button>
                                <el-button size="small" type="danger" @click="stopInstance(scope.row.profile.profileName)" :disabled="scope.row.status !== 'RUNNING'">停止</el-button>
                                <el-button size="small" @click="openLogDialog(scope.row.profile.profileName)" :disabled="scope.row.status !== 'RUNNING'">查看日志</el-button>
                            </template>
                        </el-table-column>
                    </el-table>
                </div>

                <!-- 画像管理页面 -->
                <div v-if="activeMenu === 'profiles'">
                    <h2>画像管理</h2>
                     <el-button type="primary" @click="openProfileDialog()">新建画像</el-button>
                    <el-table :data="profiles" style="width: 100%">
                        <el-table-column prop="profileName" label="画像名称"></el-table-column>
                        <el-table-column prop="enabled" label="是否启用">
                             <template #default="scope">
                                <el-switch v-model="scope.row.enabled" disabled></el-switch>
                            </template>
                        </el-table-column>
                        <el-table-column prop="device.id" label="设备ID"></el-table-column>
                        <el-table-column label="操作">
                            <template #default="scope">
                                <el-button size="small" @click="openProfileDialog(scope.row)">编辑</el-button>
                                <el-button size="small" type="danger" @click="deleteProfile(scope.row.profileName)">删除</el-button>
                            </template>
                        </el-table-column>
                    </el-table>
                </div>

                <!-- 报文管理页面 -->
                <div v-if="activeMenu === 'payloads'">
                    <h2>报文管理</h2>
                    <el-button type="primary" @click="openPayloadDialog()">新建报文</el-button>
                    <el-table :data="payloads" style="width: 100%">
                        <el-table-column prop="payloadKey" label="报文键"></el-table-column>
                        <el-table-column prop="groupKey" label="分组键"></el-table-column>
                        <el-table-column prop="payloadType" label="报文类型"></el-table-column>
                        <el-table-column prop="content" label="内容" show-overflow-tooltip></el-table-column>
                        <el-table-column prop="description" label="描述"></el-table-column>
                        <el-table-column label="操作">
                            <template #default="scope">
                                <el-button size="small" @click="openPayloadDialog(scope.row)">编辑</el-button>
                                <el-button size="small" type="danger" @click="deletePayload(scope.row.payloadKey)">删除</el-button>
                            </template>
                        </el-table-column>
                    </el-table>
                </div>

                <!-- 规则管理页面 -->
                <div v-if="activeMenu === 'rules'">
                    <h2>规则管理</h2>
                    <el-button type="primary" @click="openRuleDialog()">新建规则</el-button>
                    <el-table :data="rules" style="width: 100%">
                        <el-table-column prop="id" label="ID" width="80"></el-table-column>
                        <el-table-column prop="ruleGroup" label="规则分组"></el-table-column>
                        <el-table-column prop="requestKey" label="请求关键字" show-overflow-tooltip></el-table-column>
                        <el-table-column prop="responseKey" label="响应报文键" show-overflow-tooltip></el-table-column>
                        <el-table-column prop="description" label="描述"></el-table-column>
                        <el-table-column label="操作">
                            <template #default="scope">
                                <el-button size="small" @click="openRuleDialog(scope.row)">编辑</el-button>
                                <el-button size="small" type="danger" @click="deleteRule(scope.row.id)">删除</el-button>
                            </template>
                        </el-table-column>
                    </el-table>
                </div>
            </el-main>
        </el-container>
        
        <!-- Profile编辑/新建对话框 -->
        <el-dialog :title="isEditing ? '编辑画像' : '新建画像'" v-model="profileDialogVisible" width="60%">
            <el-form :model="currentProfile" label-width="120px">
                <el-form-item label="画像名称">
                    <el-input v-model="currentProfile.profileName" :disabled="isEditing"></el-input>
                </el-form-item>
                <el-form-item label="是否启用">
                    <el-switch v-model="currentProfile.enabled"></el-switch>
                </el-form-item>
                 <el-form-item label="设备ID">
                    <el-input v-model="currentProfile.device.id"></el-input>
                </el-form-item>

                <!-- 协议配置 -->
                <el-divider>协议配置</el-divider>
                <el-form-item label="协议类型">
                    <el-select v-model="currentProfile.protocol.type" placeholder="请选择协议类型">
                        <el-option label="TCP客户端" value="tcp-client"></el-option>
                        <el-option label="TCP服务端" value="tcp-server"></el-option>
                        <el-option label="直通协议" value="passthrough"></el-option>
                    </el-select>
                </el-form-item>
                <template v-if="currentProfile.protocol.type === 'tcp-client'">
                    <el-form-item label="主机">
                        <el-input v-model="currentProfile.protocol.properties.host"></el-input>
                    </el-form-item>
                    <el-form-item label="端口">
                        <el-input-number v-model="currentProfile.protocol.properties.port" :min="1" :max="65535"></el-input-number>
                    </el-form-item>
                </template>
                <template v-if="currentProfile.protocol.type === 'tcp-server'">
                    <el-form-item label="监听端口">
                        <el-input-number v-model="currentProfile.protocol.properties.port" :min="1" :max="65535"></el-input-number>
                    </el-form-item>
                </template>

                <!-- 编解码器配置 -->
                <el-divider>编解码器配置</el-divider>
                <el-form-item label="编解码类型">
                    <el-select v-model="currentProfile.codec.type" placeholder="请选择编解码类型">
                        <el-option label="JSON" value="json"></el-option>
                        <el-option label="HEX" value="hex"></el-option>
                        <el-option label="直通编解码" value="passthrough"></el-option>
                    </el-select>
                </el-form-item>

                <!-- 策略配置 -->
                <el-divider>策略配置</el-divider>
                <el-form-item label="策略类型">
                    <el-select v-model="currentProfile.strategy.type" placeholder="请选择策略类型">
                        <el-option label="周期性推送" value="periodic-push"></el-option>
                        <el-option label="请求-响应" value="request-response"></el-option>
                        <el-option label="原始数据回放 (已废弃)" value="raw-replay"></el-option>
                    </el-select>
                </el-form-item>
                
                <!-- 周期性推送策略配置 -->
                <template v-if="currentProfile.strategy.type === 'periodic-push'">
                    <el-form-item label="推送间隔(毫秒)">
                        <el-input-number v-model="currentProfile.strategy.properties.intervalMillis" :min="100"></el-input-number>
                    </el-form-item>
                    <el-form-item label="数据生成器类型">
                        <el-select v-model="currentProfile.dataGenerator.type" placeholder="请选择数据生成器类型">
                            <el-option label="随机生成器" value="random-generator"></el-option>
                            <el-option label="数据库生成器" value="database-generator"></el-option>
                            <el-option label="直通生成器" value="passthrough-generator"></el-option>
                        </el-select>
                    </el-form-item>
                    <template v-if="currentProfile.dataGenerator.type === 'random-generator'">
                        <el-form-item label="随机属性 (JSON)">
                            <el-input type="textarea" :rows="5" v-model="currentProfile.dataGenerator.propertiesJson" placeholder="请输入随机属性的JSON数组"></el-input>
                        </el-form-item>
                    </template>
                    <template v-if="currentProfile.dataGenerator.type === 'database-generator'">
                        <el-form-item label="报文分组键">
                            <el-tooltip content="选择一个已存在的报文分组键作为数据源" placement="top">
                                <el-select v-model="currentProfile.dataGenerator.properties.groupKey" placeholder="请选择报文分组键">
                                    <el-option v-for="key in availablePayloadGroupKeys" :key="key" :label="key" :value="key"></el-option>
                                </el-select>
                            </el-tooltip>
                        </el-form-item>
                    </template>
                </template>

                <!-- 请求-响应策略配置 -->
                <template v-if="currentProfile.strategy.type === 'request-response'">
                    <el-form-item label="数据生成器类型">
                        <el-select v-model="currentProfile.dataGenerator.type" placeholder="请选择数据生成器类型">
                            <el-option label="数据库规则生成器" value="db-rule-based"></el-option>
                            <el-option label="直通生成器" value="passthrough"></el-option>
                        </el-select>
                    </el-form-item>
                    <template v-if="currentProfile.dataGenerator.type === 'db-rule-based'">
                        <el-form-item label="规则分组键">
                            <el-tooltip content="选择一个已存在的规则分组作为请求-响应规则集" placement="top">
                                <el-select v-model="currentProfile.dataGenerator.properties.ruleGroup" placeholder="请选择规则分组">
                                    <el-option v-for="group in availableRuleGroups" :key="group" :label="group" :value="group"></el-option>
                                </el-select>
                            </el-tooltip>
                        </el-form-item>
                    </template>
                </template>

                <!-- 原始数据回放策略配置 (已废弃) -->
                <template v-if="currentProfile.strategy.type === 'raw-replay'">
                    <el-alert title="此策略已废弃，建议使用周期性推送策略配合自定义数据生成器实现相同功能。" type="warning" show-icon :closable="false"></el-alert>
                    <el-form-item label="回放文件路径">
                        <el-input v-model="currentProfile.strategy.properties.filePath"></el-input>
                    </el-form-item>
                    <el-form-item label="回放速度(倍)">
                        <el-input-number v-model="currentProfile.strategy.properties.speedFactor" :min="0.1"></el-input-number>
                    </el-form-item>
                </template>

                <!-- 原始JSON配置 (作为备用或高级配置) -->
                <el-divider>原始JSON配置 (高级)</el-divider>
                <el-form-item label="原始JSON">
                    <el-input type="textarea" :rows="10" v-model="currentProfileJson" placeholder="请输入完整的JSON配置"></el-input>
                </el-form-item>
            </el-form>
            <template #footer>
                <span class="dialog-footer">
                    <el-button @click="profileDialogVisible = false">取消</el-button>
                    <el-button type="primary" @click="saveProfile">保存</el-button>
                </span>
            </template>
        </el-dialog>

        <!-- 报文编辑/新建对话框 -->
        <el-dialog :title="isEditingPayload ? '编辑报文' : '新建报文'" v-model="payloadDialogVisible" width="50%">
            <el-form :model="currentPayload" label-width="100px">
                <el-form-item label="报文键">
                    <el-tooltip content="报文的唯一标识符，例如 'heartbeat_data'" placement="top">
                        <el-input v-model="currentPayload.payloadKey" :disabled="isEditingPayload"></el-input>
                    </el-tooltip>
                </el-form-item>
                <el-form-item label="分组键">
                    <el-tooltip content="用于将相关报文归类，例如 'DEFAULT_PUSH_PAYLOADS'" placement="top">
                        <el-input v-model="currentPayload.groupKey"></el-input>
                    </el-tooltip>
                </el-form-item>
                <el-form-item label="报文类型">
                    <el-tooltip content="报文内容的类型，例如 'JSON', 'HEX', 'STRING'" placement="top">
                        <el-input v-model="currentPayload.payloadType"></el-input>
                    </el-tooltip>
                </el-form-item>
                <el-form-item label="内容">
                    <el-tooltip content="报文的实际内容，根据报文类型输入，例如 JSON 字符串或 HEX 字符串" placement="top">
                        <el-input type="textarea" :rows="8" v-model="currentPayload.content"></el-input>
                    </el-tooltip>
                </el-form-item>
                <el-form-item label="描述">
                    <el-input v-model="currentPayload.description"></el-input>
                </el-form-item>
            </el-form>
            <template #footer>
                <span class="dialog-footer">
                    <el-button @click="payloadDialogVisible = false">取消</el-button>
                    <el-button type="primary" @click="savePayload">保存</el-button>
                </span>
            </template>
        </el-dialog>

        <!-- 规则编辑/新建对话框 -->
        <el-dialog :title="isEditingRule ? '编辑规则' : '新建规则'" v-model="ruleDialogVisible" width="50%">
            <el-form :model="currentRule" label-width="100px">
                <el-form-item label="规则分组">
                    <el-tooltip content="用于将相关规则归类，例如 'DEFAULT_HEX_RULES'" placement="top">
                        <el-input v-model="currentRule.ruleGroup"></el-input>
                    </el-tooltip>
                </el-form-item>
                <el-form-item label="请求关键字">
                    <el-tooltip content="匹配传入请求的关键字，例如 '010203' 或 '{"cmd":"status"}'" placement="top">
                        <el-input v-model="currentRule.requestKey"></el-input>
                    </el-tooltip>
                </el-form-item>
                <el-form-item label="响应报文键">
                    <el-tooltip content="选择一个已存在的报文键作为匹配成功后的响应内容" placement="top">
                        <el-select v-model="currentRule.responseKey" placeholder="请选择响应报文键">
                            <el-option v-for="key in availablePayloadKeys" :key="key" :label="key" :value="key"></el-option>
                        </el-select>
                    </el-tooltip>
                </el-form-item>
                <el-form-item label="描述">
                    <el-input v-model="currentRule.description"></el-input>
                </el-form-item>
            </el-form>
            <template #footer>
                <span class="dialog-footer">
                    <el-button @click="ruleDialogVisible = false">取消</el-button>
                    <el-button type="primary" @click="saveRule">保存</el-button>
                </span>
            </template>
        </el-dialog>

        <!-- Log Dialog -->
        <el-dialog :title="`实例日志: ${currentLogProfileName}`" v-model="logDialogVisible" width="60%" @close="closeLogDialog">
            <div class="log-container">
                <div v-for="(log, index) in logs" :key="index" :class="['log-entry', `log-${log.level.toLowerCase()}`]">
                    <span class="log-timestamp">{{ log.timestamp }}</span>
                    <span class="log-level">{{ log.level }}</span>
                    <span class="log-message">{{ log.message }}</span>
                </div>
            </div>
            <template #footer>
                <span class="dialog-footer">
                    <el-button @click="logDialogVisible = false">关闭</el-button>
                </span>
            </template>
        </el-dialog>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus/dist/index.full.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.5.0/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
