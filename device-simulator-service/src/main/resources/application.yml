server:
  port: ${SERVER_PORT:18080}

spring:
  application:
    name: device-simulator-service
  datasource:
    url: ${DB_URL:jdbc:mysql://10.80.210.73:3306/simulator_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:xinsec}
    password: ${DB_PASS:DB.xinsec@2018}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0


mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.xinsec.devicesimulator.service.entity


simulator:
  config:
    # 'file' (default) or 'database'.
    # 'file': Loads simulation profiles from the JSON files specified in the 'file.path' directory.
    # 'database': Loads simulation profiles from the database.
    provider: ${SIMULATOR_PROVIDER:database}
    file:
      storage-path: ${SIMULATOR_FILE_PATH:./data/simulation-profiles}
